name: Code Testing

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup PHP with PECL extension 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Install 🔧
        run: |
          composer validate
          composer install --prefer-dist --no-progress --no-suggest

      - name: Unit Test 🤞
        run: composer unit-test

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}       # run this step even if previous step failed
        with:
          name: Unit Tests            # Name of the check run which will be created
          path: reports/ut-junit.xml    # Path to test results
          reporter: java-junit        # Format of test results

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-test-html
          path: reports/ut-results.html

      - name: Upload Coverage 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage
          path: reports

  integration-testing:
    name: Integration Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup PHP with PECL extension 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Install 🔧
        run: |
          composer validate
          composer install --prefer-dist --no-progress --no-suggest
          sudo apt-get update
          sudo apt-get install -y imagemagick
          sudo pear channel-update pear.php.net
          sudo pear install Mail Mail_Mime pear/Net_SMTP

      - name: Set up CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          db-port: '3506'
          email-host: 127.0.0.1

      - name: Integration Test 🤞
        run: |
          sudo mkdir -p /var/www/logs
          sudo chmod 777 /var/www
          sudo chmod 777 /var/www/logs
          composer integration-pre-test
          composer integration-test

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}       # run this step even if previous step failed
        with:
          name: Integration Tests            # Name of the check run which will be created
          path: reports/it-junit.xml    # Path to test results
          reporter: java-junit        # Format of test results

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-test-html
          path: reports/it-results.html

      - name: Upload Coverage 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-coverage
          path: reports

  javascript-unit-testing:
    name: JavaScript Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript Unit Test 🤞
        run: bash bin/test-js.sh

      - name: Upload Coverage 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: reports/js-lcov.info

  sonar:
    name: SonarCloud
    needs: [ unit-testing, integration-testing, javascript-unit-testing ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Get UT Coverage
        uses: actions/download-artifact@v4
        with:
          name: ut-coverage
          path: ut

      - name: Get IT Coverage
        uses: actions/download-artifact@v4
        with:
          name: it-coverage
          path: it/

      - name: Get JS Coverage
        uses: actions/download-artifact@v4
        with:
          name: js-coverage
          path: js/

      - name: Combine Reports
        run: mkdir reports; mv ut/* reports/; mv it/* reports/; mv js/* reports/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: Code Testing

on:
  pull_request:
    branches: [ develop ]

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup PHP with PECL extension 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Install 🔧
        run: |
          composer validate
          composer install --prefer-dist --no-progress --no-suggest

      - name: Unit Test 🤞
        run: composer unit-test

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}       # run this step even if previous step failed
        with:
          name: Unit Tests            # Name of the check run which will be created
          path: reports/ut-junit.xml    # Path to test results
          reporter: java-junit        # Format of test results

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-test-html
          path: reports/ut-results.html

      - name: Upload Coverage 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage
          path: reports

  integration-testing:
    name: Integration Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup PHP with PECL extension 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Install 🔧
        run: |
          composer validate
          composer install --prefer-dist --no-progress --no-suggest
          sudo apt install imagemagick
          sudo pear channel-update pear.php.net
          sudo pear install Mail Mail_Mime pear/Net_SMTP

      - name: Set up env file
        run: |
          echo '# tool hosting information' > .env
          echo 'ADMIN_PORT=9090' >> .env
          echo 'HTTP_PORT=90' >> .env
          echo 'HTTPS_PORT=9443' >> .env
          echo 'SERVER_NAME=localhost' >> .env
          echo 'APP_URL=localhost' >> .env
          echo '' >> .env
          echo '# database information' >> .env
          echo 'DB_HOST=127.0.0.1' >> .env
          echo 'DB_ROOT=${{ secrets.DB_ROOT }}' >> .env
          echo 'DB_PORT=3506' >> .env
          echo 'DB_NAME=saperstone-studios' >> .env
          echo 'DB_USER=${{ secrets.DB_USER }}' >> .env
          echo 'DB_PASS=${{ secrets.DB_PASS }}' >> .env
          echo '' >> .env
          echo '# email information' >> .env
          echo 'EMAIL_CONTACT=contact@saperstonestudios.com' >> .env
          echo 'EMAIL_ACTIONS=actions@saperstonestudios.com' >> .env
          echo 'EMAIL_SELECTS=selects@saperstonestudios.com' >> .env
          echo 'EMAIL_CONTRACTS=contracts@saperstonestudios.com' >> .env
          echo 'EMAIL_HOST=127.0.0.1' >> .env
          echo 'EMAIL_PORT=1025' >> .env
          echo 'EMAIL_USER=${{ secrets.EMAIL_USER }}' >> .env
          echo 'EMAIL_PASS=dummypassword' >> .env
          echo 'EMAIL_USER_X=${{ secrets.EMAIL_USER_X }}' >> .env
          echo 'EMAIL_PASS_X=dummypassword' >> .env

      - name: Integration Test 🤞
        run: |
          sudo mkdir -p /var/www/logs
          sudo chmod 777 /var/www
          sudo chmod 777 /var/www/logs
          composer integration-pre-test
          composer integration-test

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}       # run this step even if previous step failed
        with:
          name: Integration Tests            # Name of the check run which will be created
          path: reports/it-junit.xml    # Path to test results
          reporter: java-junit        # Format of test results

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-test-html
          path: reports/it-results.html

      - name: Upload Coverage 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-coverage
          path: reports

  sonar:
    name: SonarCloud
    needs: [ unit-testing, integration-testing ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Get UT Coverage
        uses: actions/download-artifact@v4
        with:
          name: ut-coverage
          path: ut

      - name: Get IT Coverage
        uses: actions/download-artifact@v4
        with:
          name: it-coverage
          path: it/

      - name: Combine Reports
        run: mkdir reports; mv ut/* reports/; mv it/* reports/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

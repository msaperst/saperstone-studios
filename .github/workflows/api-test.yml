name: API Testing

on:
  pull_request:
    branches: [ develop ]

jobs:
  api_tests:
    name: API Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: System Setup
        run: |
          composer clean
          composer install --prefer-dist --no-progress --no-suggest

      - name: API Tests
        run: COMPOSER_PROCESS_TIMEOUT=1200 composer api-test

      # Capture actual Apache/PHP failures instead of treating network-level
      # "empty reply from server" errors as intermittent Guzzle problems.
      - name: Diagnose application container on API failure
        if: failure()
        run: |
          echo "::group::Docker container status"
          docker compose ps || true
          docker inspect --format 'State={{.State.Status}} Exit={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} RestartCount={{.RestartCount}}' saperstonestudios_php || true
          echo "::endgroup::"
          echo "::group::PHP/Apache container logs"
          docker compose logs --no-color --tail=200 php || true
          echo "::endgroup::"

      - name: API Test Summary 📊
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "API Tests" \
            --junit reports/api-junit.xml | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-html
          path: reports/api-results.html

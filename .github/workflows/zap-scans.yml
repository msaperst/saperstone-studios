name: ZAP Scans

on:
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '23 22 * * 1'
  workflow_dispatch:
    inputs:
      scan:
        description: 'ZAP scan to run'
        required: true
        default: full
        type: choice
        options:
          - baseline
          - full

permissions:
  contents: read

jobs:
  baseline:
    name: ZAP Baseline Scan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.scan == 'baseline')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:90/'
          allow_issue_writing: true
          fail_action: false
          artifact_name: zap-baseline-report

  full:
    name: ZAP Full Scan
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scan == 'full')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:90/'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-full-report

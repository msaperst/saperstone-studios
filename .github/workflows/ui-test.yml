name: UI Testing

on:
  pull_request:
    branches: [ develop ]

jobs:
  page_tests:
    name: HTTP Page Testing
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: System Setup
        run: |
          composer clean
          composer install --prefer-dist --no-progress --no-suggest

      - name: HTTP Page Tests
        run: composer http-page-test

      - name: Test Summary 📊
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "HTTP Page Tests" \
            --junit reports/http-page-junit.xml | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload HTTP Page Reports 📊
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: http-page-reports
          path: |
            reports/http-page-junit.xml
            reports/http-page-results.html
          if-no-files-found: warn

  behat_tests:
    name: Behat Testing
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack
        env:
          SEND_EMAIL_AFTER: "1"

      - name: System Setup
        run: |
          composer clean
          composer install --prefer-dist --no-progress --no-suggest
          # GitHub's Ubuntu runner already provides a matched Chrome/ChromeDriver pair.
          # Installing chromium-chromedriver through apt triggers a snap download,
          # which is an unnecessary external dependency and can time out.
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          google-chrome --version
          "${CHROMEWEBDRIVER}/chromedriver" --version
          "${CHROMEWEBDRIVER}/chromedriver" --port=4444 > "${RUNNER_TEMP}/chromedriver.log" 2>&1 &

          # Fail with driver diagnostics if WebDriver cannot start.
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4444/status > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "${RUNNER_TEMP}/chromedriver.log"
            exit 1
          fi

      - name: Behat Tests
        env:
          COMPOSER_PROCESS_TIMEOUT: 2700
        run: composer ui-behat-test

      - name: Behat Test Summary 📊
        if: always()
        run: |
          python3 .github/scripts/test-summary.py \
            --title "Behat Tests" \
            --junit reports/behat/default.xml | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Behat Reports 📊
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: behat-reports
          path: reports/behat
          if-no-files-found: warn

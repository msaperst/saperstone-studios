name: UI Testing

on:
  pull_request:
    branches: [ develop ]

jobs:
  page_tests:
    name: Page Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: Set up Gmail Credentials and Token
        run: |
          echo '${{ secrets.GMAIL_TEST_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GMAIL_TEST_TOKEN }}' > token.json

      - name: System Setup
        run: |
          composer clean
          composer install --prefer-dist --no-progress --no-suggest
          sudo apt install chromium-chromedriver
          chromedriver --port=4444 &

      - name: Page Tests
        run: COMPOSER_PROCESS_TIMEOUT=1200 composer ui-page-test

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: UI Page Tests
          path: reports/ui-junit.xml
          reporter: java-junit

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-html
          path: reports/ui-results.html

      - name: Upload Custom Report 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: reports

  behat_tests:
    name: Behat Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: imagick

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: Set up Gmail Credentials and Token
        run: |
          echo '${{ secrets.GMAIL_TEST_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GMAIL_TEST_TOKEN }}' > token.json

      - name: System Setup
        run: |
          composer clean
          composer install --prefer-dist --no-progress --no-suggest
          sudo apt install chromium-chromedriver
          chromedriver --port=4444 &

      - name: Behat Tests
        run: COMPOSER_PROCESS_TIMEOUT=1200 composer ui-behat-test

      - name: Upload Custom Report 📊
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behat
          path: reports

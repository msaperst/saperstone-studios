name: Resolve temporary Composer security patch

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'fix/album-thumbnail-long-edge-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, curl, mysqli
      - name: Resolve only symfony/yaml patch with Composer
        run: |
          composer update symfony/yaml --with-all-dependencies --prefer-dist --no-progress --no-interaction
          composer validate
          composer audit --locked --no-interaction
      - name: Output resolved package metadata for branch update
        run: |
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            foreach ($lock["packages-dev"] as $package) {
                if ($package["name"] === "symfony/yaml") {
                    echo "RESOLVED_YAML_PACKAGE_BEGIN\n";
                    echo base64_encode(json_encode($package, JSON_UNESCAPED_SLASHES)) . "\n";
                    echo "RESOLVED_YAML_PACKAGE_END\n";
                    exit(0);
                }
            }
            fwrite(STDERR, "Package not found after resolution\n");
            exit(1);
          '

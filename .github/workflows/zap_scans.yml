name: Zap Scans

on:
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '23 22 * * 1'

jobs:
  baseline:
    name: Zap Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:90'
          allow_issue_writing: false

  full:
    name: Zap Full Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Set up full-stack test application
        uses: ./.github/actions/setup-full-stack

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:90'
          allow_issue_writing: false

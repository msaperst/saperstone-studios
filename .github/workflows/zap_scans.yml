name: Zap Scans

on:
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '23 22 * * 1'

jobs:
  baseline:
    name: Zap Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Set up CI environment
        env:
          DB_ROOT: ${{ secrets.DB_ROOT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_USER_X: ${{ secrets.EMAIL_USER_X }}
        run: bash bin/setup-ci-environment.sh

      - name: Launch App 🐋
        run: docker compose up --build -d

      - name: Verify Liveliness
        run: curl --retry 50 -f --retry-all-errors --retry-delay 5 -s -o /dev/null "http://localhost:90/"

      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:90'
          allow_issue_writing: false

  full:
    name: Zap Full Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Set up CI environment
        env:
          DB_ROOT: ${{ secrets.DB_ROOT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_USER_X: ${{ secrets.EMAIL_USER_X }}
        run: bash bin/setup-ci-environment.sh

      - name: Launch App 🐋
        run: docker compose up --build -d

      - name: Verify Liveliness
        run: curl --retry 50 -f --retry-all-errors --retry-delay 5 -s -o /dev/null "http://localhost:90/"

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.4.0
        with:
          target: 'http://localhost:90'
          allow_issue_writing: false

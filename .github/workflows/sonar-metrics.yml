name: Temporary Sonar Metrics

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read

jobs:
  sonar-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Query SonarCloud PR metrics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "=== OVERALL ==="
          curl --fail --silent --show-error -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/measures/component" \
            --data-urlencode "component=msaperst_saperstone-studios" \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode "metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_duplicated_lines_density,new_duplicated_lines,new_lines" \
            | jq -c '.component.measures'

          echo "=== BY FILE ==="
          curl --fail --silent --show-error -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/measures/component_tree" \
            --data-urlencode "component=msaperst_saperstone-studios" \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode "metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_duplicated_lines_density,new_duplicated_lines,new_lines" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "ps=500" \
            | jq -r '.components[] | (.measures | map({key:.metric,value:(.period.value // .periods[0].value // .value // "0")}) | from_entries) as $m | select((($m.new_lines // "0") | tonumber) > 0 or (($m.new_lines_to_cover // "0") | tonumber) > 0 or (($m.new_duplicated_lines // "0") | tonumber) > 0) | [.path, ($m.new_lines // "0"), ($m.new_lines_to_cover // "0"), ($m.new_uncovered_lines // "0"), ($m.new_coverage // "100"), ($m.new_duplicated_lines // "0"), ($m.new_duplicated_lines_density // "0")] | @tsv'

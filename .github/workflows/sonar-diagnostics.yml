name: Temporary Sonar Diagnostics

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  sonar-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Query SonarCloud PR analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "=== OPEN PR ISSUES ==="
          curl --fail --silent --show-error -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/issues/search" \
            --data-urlencode "componentKeys=msaperst_saperstone-studios" \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            | jq -r '.issues[] | [.type, .severity, .rule, .component, (.line // 0), .message] | @tsv'

          echo "=== NEW-CODE METRICS BY FILE ==="
          curl --fail --silent --show-error -u "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/measures/component_tree" \
            --data-urlencode "component=msaperst_saperstone-studios" \
            --data-urlencode "pullRequest=${PR_NUMBER}" \
            --data-urlencode "metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines,new_duplicated_lines_density,new_duplicated_lines,new_lines" \
            --data-urlencode "qualifiers=FIL" \
            --data-urlencode "ps=500" \
            | jq -r '.components[] | [.path, ((.measures | map({key:.metric,value:(.period.value // .value)}) | from_entries).new_lines // "0"), ((.measures | map({key:.metric,value:(.period.value // .value)}) | from_entries).new_lines_to_cover // "0"), ((.measures | map({key:.metric,value:(.period.value // .value)}) | from_entries).new_uncovered_lines // "0"), ((.measures | map({key:.metric,value:(.period.value // .value)}) | from_entries).new_coverage // "100"), ((.measures | map({key:.metric,value:(.period.value // .value)}) | from_entries).new_duplicated_lines // "0"), ((.measures | map({key:.metric,value:(.period.value // .value)}) | from_entries).new_duplicated_lines_density // "0")] | @tsv'

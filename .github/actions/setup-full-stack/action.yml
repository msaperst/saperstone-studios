name: Set up full-stack test application
description: Configure and launch the common Docker Compose application used by full-stack CI tests

runs:
  using: composite
  steps:
    - name: Set up CI environment
      uses: ./.github/actions/setup-ci-env

    - name: Disable production SSL certificate
      shell: bash
      run: sed -i '/letsencrypt/ s/^/#/' .docker/php/default-ssl.conf

    # Compose creates absent bind-mount source directories as root on the host.
    # Tests also write fixtures from the GitHub runner, so create these as the
    # runner before Docker starts. prepare-local-content.sh will assign the
    # Apache write group and setgid permissions without changing ownership.
    - name: Prepare writable test content mounts
      shell: bash
      run: |
        mkdir -p \
          content/{commercial,portrait,wedding,b-nai-mitzvah,main,reviews,albums,blog,contracts} \
          logs tmp

    - name: Launch application
      shell: bash
      run: docker compose up --build -d

    - name: Verify application liveliness
      shell: bash
      run: curl --retry 50 -f --retry-all-errors --retry-delay 5 -s -o /dev/null "http://localhost:90/"

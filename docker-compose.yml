services:
  mailpit:
    image: axllent/mailpit
    container_name: saperstonestudios_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  mysql:
    build:
      context: .
      dockerfile: .docker/sql/Dockerfile
    container_name: saperstonestudios_mysql
    restart: always
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    environment:
      TZ: "America/New_York"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}

  php-myadmin:
    image: phpmyadmin/phpmyadmin
    container_name: saperstonestudios_phpmyadmin
    restart: always
    depends_on:
      - mysql
    ports:
      - "${ADMIN_PORT}:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_ROOT}

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: saperstonestudios_php
    restart: always
    depends_on:
      - mysql
      - mailpit
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      # Mount the repository at Apache's application root so local source,
      # images, content, templates, and scripts are all read directly without
      # rebuilding the PHP image after each edit.
      - ./:/var/www
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SERVER_NAME: ${SERVER_NAME}
      EMAIL_CONTACT: ${EMAIL_CONTACT}
      EMAIL_ACTIONS: ${EMAIL_ACTIONS}
      EMAIL_SELECTS: ${EMAIL_SELECTS}
      EMAIL_CONTRACTS: ${EMAIL_CONTRACTS}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_USER_X: ${EMAIL_USER_X}
      EMAIL_PASS_X: ${EMAIL_PASS_X}
      CLEAN_UP_AFTER: "60"
      SEND_EMAIL_AFTER: "20"

volumes:
  mysql:

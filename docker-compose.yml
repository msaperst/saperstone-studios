services:
  mailpit:
    image: axllent/mailpit
    container_name: saperstonestudios_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  mysql:
    build:
      context: .
      dockerfile: .docker/sql/Dockerfile
    container_name: saperstonestudios_mysql
    restart: always
    volumes:
      - mysql:/var/lib/mysql
    ports:
      - "${DB_PORT}:3306"
    environment:
      TZ: "America/New_York"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_ROOT_PASSWORD: ${DB_ROOT}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: saperstonestudios_phpmyadmin
    restart: always
    depends_on:
      - mysql
    ports:
      - "${ADMIN_PORT}:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_ROOT}

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: saperstonestudios_php
    restart: always
    depends_on:
      - mysql
      - mailpit
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    command:
      - /bin/bash
      - -c
      - bash ./bin/prepare-local-content.sh && exec ./bin/setup-database.sh
    volumes:
      # Application source is bind-mounted for immediate local PHP/JS/CSS edits.
      - ./public:/var/www/public
      - jsignature:/var/www/public/js/jSignature
      - ./src:/var/www/src
      - ./templates:/var/www/templates
      - ./bin:/var/www/bin
      - ./content:/var/www/content
      - ./logs:/var/www/logs
      - ./tmp:/var/www/public/tmp
      # The public source bind mount hides image-build symlinks, so overlay the
      # local content directories at the public paths Apache serves.
      # Upload, crop, thumbnail, and blog endpoints write through these paths.
      - ./content/commercial:/var/www/public/commercial/img
      - ./content/portrait:/var/www/public/portrait/img
      - ./content/wedding:/var/www/public/wedding/img
      - ./content/b-nai-mitzvah:/var/www/public/b-nai-mitzvah/img
      - ./content/main:/var/www/public/img/main
      - ./content/reviews:/var/www/public/img/reviews
      - ./content/albums:/var/www/public/albums
      - ./content/blog:/var/www/public/blog/posts
      - ./content/contracts:/var/www/public/user/contracts
      - ./src/errors:/var/www/public/errors:ro
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SERVER_NAME: ${SERVER_NAME}
      EMAIL_CONTACT: ${EMAIL_CONTACT}
      EMAIL_ACTIONS: ${EMAIL_ACTIONS}
      EMAIL_SELECTS: ${EMAIL_SELECTS}
      EMAIL_CONTRACTS: ${EMAIL_CONTRACTS}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_USER_X: ${EMAIL_USER_X}
      EMAIL_PASS_X: ${EMAIL_PASS_X}
      CLEAN_UP_AFTER: "60"
      SEND_EMAIL_AFTER: "20"

volumes:
  mysql:
  jsignature:

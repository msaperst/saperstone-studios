sonar.organization=msaperst
sonar.projectKey=msaperst_saperstone-studios
sonar.projectName='Saperstone Studios'
sonar.projectVersion=3.0
sonar.sources=./bin,./public,./src,./templates
sonar.tests=./tests

# Exclude only pristine third-party assets and non-source/static content.
# Locally modified third-party forks remain in static analysis.
sonar.exclusions=public/js/jqBootstrapValidation.js,public/js/jquery.form.min.js,public/css/uploadfile.css,public/favicon.ico,public/img/**,public/retouch/**,public/portrait/what-to-wear/**

# jquery.uploadfile.js is a locally maintained fork, so Sonar analyzes it.
# Most of the file is inherited vendor internals, so aggregate line coverage
# excludes the fork while targeted Jest/Behat coverage protects our changes.
sonar.coverage.exclusions=public/js/jquery.uploadfile.js

# Repository .sql files are MySQL input executed by setup-database.sh.
# Sonar associates .sql with Oracle PL/SQL by default, which produces invalid
# findings for MySQL syntax. Keep Oracle-specific suffixes only.
sonar.plsql.file.suffixes=pks,pkb

sonar.php.tests.reportPath=./reports/ut-junit.xml
sonar.php.coverage.reportPaths=./reports/it-clover.xml,./reports/ut-clover.xml
sonar.javascript.lcov.reportPaths=./reports/js-lcov.info
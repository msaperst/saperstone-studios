---
env:
  contexts:
    - name: saperstone-studios
      urls:
        - http://localhost:90
      includePaths:
        - http://localhost:90.*
      authentication:
        method: manual
        verification:
          method: poll
          loggedInRegex: "200 OK"
          loggedOutRegex: "401 Unauthorized"
          pollFrequency: 60
          pollUnits: requests
          pollUrl: http://localhost:90/api/get-users.php
          pollPostData: ""
      sessionManagement:
        method: cookie
      users:
        - name: zap-ci
          credentials:
            username: ${ZAP_USERNAME}
            password: ${ZAP_PASSWORD}
  parameters:
    failOnError: true
    failOnWarning: true
    progressToStdout: true

jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: Authenticate the ephemeral ZAP CI user
        url: "http://localhost:90.*"
        method: ""
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: "hash=3fa5449987c49f7b606bcbeabe5c9927"
        tokenProcessing: false

  - type: requestor
    parameters:
      user: zap-ci
    requests:
      - url: http://localhost:90/api/get-users.php
        name: Verify authenticated admin session
        method: GET
        responseCode: 200
  - type: spider
    parameters:
      context: saperstone-studios
      user: zap-ci
      url: http://localhost:90/
      maxDuration: 5
      logoutAvoidance: true

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: report_html.html
      reportTitle: Saperstone Studios ZAP Baseline Scan

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: report_json.json
      reportTitle: Saperstone Studios ZAP Baseline Scan

  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk
      reportFile: report_md.md
      reportTitle: Saperstone Studios ZAP Baseline Scan

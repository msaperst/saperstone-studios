---
env:
  contexts:
    - name: saperstone-studios
      urls:
        - http://localhost:90
      includePaths:
        - http://localhost:90.*
      authentication:
        method: form
        parameters:
          loginPageUrl: http://localhost:90/
          loginRequestUrl: http://localhost:90/api/login.php
          loginRequestBody: "username={%username%}&password={%password%}&rememberMe=0&submit=Login"
        verification:
          method: poll
          loggedInRegex: "200 OK"
          loggedOutRegex: "401 Unauthorized"
          pollFrequency: 60
          pollUnits: requests
          pollUrl: http://localhost:90/api/get-users.php
          pollPostData: ""
      sessionManagement:
        method: cookie
      users:
        - name: zap-ci
          credentials:
            username: ${ZAP_USERNAME}
            password: ${ZAP_PASSWORD}
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: saperstone-studios
      user: zap-ci
      url: http://localhost:90/
      maxDuration: 5
      logoutAvoidance: true

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: report_html.html
      reportTitle: Saperstone Studios ZAP Baseline Scan

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: report_json.json
      reportTitle: Saperstone Studios ZAP Baseline Scan

  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk
      reportFile: report_md.md
      reportTitle: Saperstone Studios ZAP Baseline Scan

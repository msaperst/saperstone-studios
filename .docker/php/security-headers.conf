# Minimize public server implementation details.
ServerTokens Prod
ServerSignature Off

# Prevent MIME-type sniffing on static and dynamic responses.
Header always set X-Content-Type-Options "nosniff"

# Baseline policy for the site's current inline code and third-party resources.
# Keep third-party hosts scoped to the directive that requires them.
Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://cdn.datatables.net https://www.googletagmanager.com https://connect.facebook.net https://static.addtoany.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://cdn.datatables.net https://static.addtoany.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://cdn.datatables.net https://www.facebook.com https://www.google-analytics.com https://www.googletagmanager.com https://static.addtoany.com; font-src 'self' data: https://maxcdn.bootstrapcdn.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.facebook.com https://static.addtoany.com; frame-src https://www.google.com https://static.addtoany.com; worker-src 'self' blob:; manifest-src 'self'"

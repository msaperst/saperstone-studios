# Minimize public server implementation details.
ServerTokens Prod
ServerSignature Off

# Prevent MIME-type sniffing on static and dynamic responses.
Header always set X-Content-Type-Options "nosniff"

# Content Security Policy for application and approved third-party resources.
# Legacy jQuery/Bootstrap components require runtime style-attribute updates; source inline styles remain prohibited by tests.
# Keep third-party hosts scoped to the directive that requires them.
Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://cdn.datatables.net https://www.googletagmanager.com https://connect.facebook.net; script-src-attr 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com https://cdn.datatables.net; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://cdn.datatables.net https://www.facebook.com https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self' data: https://maxcdn.bootstrapcdn.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.facebook.com; frame-src https://www.google.com; worker-src 'self' blob:; manifest-src 'self'"

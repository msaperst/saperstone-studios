# Serve public site images from the content volume. Local source bind mounts
# replace /var/www/public and hide the image symlinks created at build time.
Alias /img/main/ /var/www/content/main/
Alias /img/reviews/ /var/www/content/reviews/
Alias /commercial/img/ /var/www/content/commercial/
Alias /portrait/img/ /var/www/content/portrait/
Alias /wedding/img/ /var/www/content/wedding/
Alias /b-nai-mitzvah/img/ /var/www/content/b-nai-mitzvah/

<Directory /var/www/content>
    Options -Indexes
    Require all granted
</Directory>
